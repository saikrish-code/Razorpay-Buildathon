<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Clean white background with subtle rounded border -->
  <rect width="32" height="32" rx="6" fill="#FFFFFF" />

  <!-- Razorpay-inspired angular sharp-cut "R" in Navy #0C2651 with return-arrow hook -->
  <g stroke="#0C2651" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Vertical stem -->
    <line x1="8" y1="6" x2="8" y2="26" />
